name: Windows Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-windows-client:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m py_compile engine_server.py server.py board_tracker.py windows/cheezie_windows.py
      - name: Smoke test chess import
        shell: pwsh
        run: |
          python -c "import chess; print(chess.__version__)"
